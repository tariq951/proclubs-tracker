name: Build Windows Executable (.exe)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11 with Pip Caching
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build Windows .exe with PyInstaller
      run: |
        pyinstaller --onefile --name "pro_clubs_tracker" --add-data "assets;assets" --add-data "logo_cache;logo_cache" main.py

    - name: Upload Windows Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: pro_clubs_tracker-windows-exe
        path: dist/pro_clubs_tracker.exe
        retention-days: 7

    - name: Upload .exe to GitHub Release Asset
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: dist/pro_clubs_tracker.exe
        tag_name: ${{ github.event.release.tag_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
