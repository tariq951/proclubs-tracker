name: Build Windows Executable (.exe)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build Windows .exe with PyInstaller
      run: |
        pyinstaller --onefile --name "pro_clubs_tracker" --add-data "assets;assets" --add-data "logo_cache;logo_cache" main.py

    - name: Upload Windows Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: pro_clubs_tracker-windows-exe
        path: dist/pro_clubs_tracker.exe
